[project]
name = "jev-dcm"
version = "0.1.0"
description = "Discrete-choice diagnostics for Jev-style decision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
jev-dcm = "jev_dcm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_dcm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
